spring:
  datasource:
    url: jdbc:h2:mem:data-sync-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true

data-sync:
  crypto:
    master-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    local-key-path: target/test-master.key
  seatunnel:
    base-url: http://127.0.0.1:1
    request-timeout: 1s
    poll-delay: 1h
